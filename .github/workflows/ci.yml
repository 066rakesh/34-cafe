name: CI

# konse events pe ye workflow chalega
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- FRONTEND JOB ----------
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

  # ---------- BACKEND JOB ----------
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
      # note: server ko actually start karke test nahi kar rahe kyunki
      # usse MongoDB URI jaisa live secret chahiye hota hai jo abhi
      # GitHub Actions mein set nahi hai. Abhi ke liye 'install successful'
      # hi confirm karta hai ki code structurally sahi hai.