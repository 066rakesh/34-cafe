name: CI

# konse events pe ye workflow chalega
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- FRONTEND JOB ----------
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend   # sab commands frontend/ folder ke andar chalenge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  # ---------- BACKEND JOB ----------
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend   # exact case match — folder naam "Backend" hai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify server starts without crashing
        run: timeout 10s npm start || code=$?; if [ "$code" -ne 124 ] && [ -n "$code" ]; then exit $code; fi